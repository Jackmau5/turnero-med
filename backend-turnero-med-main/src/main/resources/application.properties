spring.application.name=turnero-med
spring.profiles.default=local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET}
app.cors.origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.carrito.minutos-reserva=15
management.endpoints.web.exposure.include=health
server.error.include-message=never
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# Cookie de sesión (JWT HttpOnly). En producción con HTTPS: COOKIE_SECURE=true
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAMESITE:Lax}
