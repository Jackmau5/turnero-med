# 1. Configuración de la Fuente de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db3?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# 2. Driver específico
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. JWT
app.jwt.secret=turnero-med-clave-secreta-para-firmar-tokens-cambiar-en-produccion
app.jwt.expiration-ms=86400000

# 5. Admin por defecto (bootstrap, solo se crea si todavía no existe ningún admin)
app.admin.email=admin@turnero-med.com
app.admin.password=admin1234